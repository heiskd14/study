{% extends "base.html" %}

{% block title %}Beyond The Classroom — Exam Registration{% endblock %}

{% block content %}
<div class="registration-container page-wrapper">
    <div class="registration-box">
        <div class="reg-logo">
            <a href="{{ url_for('home') }}" class="reg-back">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
                Back
            </a>
            <span class="reg-brand" style="display:flex;align-items:center;gap:8px;">
                <img src="{{ url_for('static', filename='img/btc_logo.png') }}" alt="BTC Logo" style="width:28px;height:28px;border-radius:6px;object-fit:cover;">
                Beyond The Classroom
            </span>
        </div>
        <h1 class="registration-title">Exam Registration</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required autofocus>
            </div>
            <div class="form-group">
                <label for="regno">Registration Number</label>
                <input type="text" id="regno" name="regno" class="form-input" placeholder="Enter your reg. number" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:8px;">Start Exam</button>
        </form>
    </div>
</div>
{% endblock %}
