<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verification — Beyond The Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg:#05060f;--glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.10);
      --accent:#137a13;--accent-light:#1aaa1a;--accent-glow:rgba(19,122,19,0.35);
      --text:#f0f0f8;--text-muted:#8888aa;--radius:20px;
      --font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4;animation:drift 12s ease-in-out infinite alternate;}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,#137a1388,transparent 70%);top:-150px;left:-100px;}
    .orb-2{width:400px;height:400px;background:radial-gradient(circle,#0a5c0a66,transparent 70%);bottom:-100px;right:-80px;animation-delay:-4s;}
    @keyframes drift{from{transform:translate(0,0);}to{transform:translate(30px,50px);}}
    .card{position:relative;z-index:1;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);backdrop-filter:blur(24px);}
    .icon{width:80px;height:80px;margin:0 auto 1.5rem;border-radius:20px;display:grid;place-items:center;font-size:2rem;}
    .icon.success{background:linear-gradient(135deg,#137a13,#1aaa1a);box-shadow:0 8px 28px rgba(19,122,19,0.45);}
    .icon.error{background:linear-gradient(135deg,#7a1313,#aa1a1a);box-shadow:0 8px 28px rgba(122,19,19,0.45);}
    h1{font-family:var(--font-display);font-size:1.8rem;font-weight:700;margin-bottom:0.6rem;}
    p{color:var(--text-muted);font-size:0.95rem;line-height:1.6;margin-bottom:1rem;}
    .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.9rem 2rem;background:linear-gradient(135deg,var(--accent),var(--accent-light));border:none;border-radius:12px;color:white;font-family:var(--font-display);font-size:1rem;font-weight:600;text-decoration:none;margin-top:1rem;box-shadow:0 6px 20px rgba(19,122,19,0.4);transition:transform 0.2s,box-shadow 0.2s;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(19,122,19,0.55);}
    .logo{position:fixed;top:1.5rem;left:2rem;display:flex;align-items:center;gap:0.6rem;font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none;z-index:10;}
    .logo-box{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent-light));border-radius:9px;display:grid;place-items:center;font-size:0.9rem;font-weight:800;color:white;}
  </style>
</head>
<body>
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <a href="/" class="logo">
    <div class="logo-box">B</div>
    Beyond The Classroom
  </a>

  <div class="card">
    {% if success %}
      <div class="icon success"><i class="fa-solid fa-circle-check" style="color:white;"></i></div>
      <h1>Email Verified!</h1>
      <p>Your account is now active. You can log in and start using Beyond The Classroom.</p>
      <a href="/login" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Go to Login</a>
    {% else %}
      <div class="icon error"><i class="fa-solid fa-circle-xmark" style="color:white;"></i></div>
      <h1>Verification Failed</h1>
      <p>{{ message or "This link is invalid or has already been used. Please sign up again." }}</p>
      <a href="/login?tab=signup" class="btn"><i class="fa-solid fa-user-plus"></i> Sign Up Again</a>
    {% endif %}
  </div>
</body>
</html>
