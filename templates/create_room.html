<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Study Room — BTC</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg:#05060f; --glass:rgba(255,255,255,0.06); --glass-border:rgba(255,255,255,0.10);
      --accent:#137a13; --accent-light:#1aaa1a; --accent-glow:rgba(19,122,19,0.35);
      --text:#f0f0f8; --text-muted:#8888aa; --text-dim:#4a4a6a; --error:#ff5068; --success:#3effa0;
      --radius:20px; --radius-sm:12px;
      --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
      --spring:0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;}
    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.4;}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,#137a1388,transparent 70%);top:-150px;left:-100px;}
    .orb-2{width:400px;height:400px;background:radial-gradient(circle,#0a5c0a66,transparent 70%);bottom:-100px;right:-80px;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.5rem;background:rgba(5,6,15,0.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);}
    .nav-logo{display:flex;align-items:center;gap:0.6rem;font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none;}
    .nav-logo img{width:32px;height:32px;border-radius:8px;}
    .nav-back{font-size:0.85rem;color:var(--text-muted);text-decoration:none;padding:0.45rem 1rem;border-radius:50px;border:1px solid var(--glass-border);transition:0.2s;}
    .nav-back:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
    main{position:relative;z-index:1;width:100%;max-width:480px;padding:7rem 1.5rem 3rem;}
    .card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2.5rem 2.2rem;box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 60px rgba(19,122,19,0.06);backdrop-filter:blur(24px);animation:fadeUp 0.5s var(--spring);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px) scale(0.97);}to{opacity:1;transform:none;}}
    .card-header{text-align:center;margin-bottom:2rem;}
    .card-icon{width:64px;height:64px;margin:0 auto 1rem;background:linear-gradient(135deg,var(--accent),var(--accent-light));border-radius:18px;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 8px 24px var(--accent-glow);animation:popIn 0.6s var(--spring);}
    @keyframes popIn{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0);}}
    .card-header h1{font-family:var(--font-display);font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--text) 40%,var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .card-header p{color:var(--text-muted);font-size:0.9rem;margin-top:0.3rem;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{display:block;font-size:0.78rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.45rem;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:0.85rem;pointer-events:none;}
    input[type=password],input[type=text]{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);padding:0.85rem 1rem 0.85rem 2.7rem;color:var(--text);font-family:var(--font-body);font-size:0.95rem;outline:none;transition:0.3s;}
    input:focus{border-color:var(--accent);background:rgba(19,122,19,0.06);box-shadow:0 0 0 3px rgba(19,122,19,0.15);}
    input::placeholder{color:var(--text-dim);}
    .toggle-pw{position:absolute;right:0.8rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.9rem;}
    .toggle-pw:hover{color:var(--text);}
    .optional-label{font-size:0.75rem;color:var(--text-dim);margin-left:0.3rem;font-style:italic;}
    .btn{width:100%;padding:0.95rem;background:linear-gradient(135deg,var(--accent),var(--accent-light));border:none;border-radius:var(--radius-sm);color:white;font-family:var(--font-display);font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:transform var(--spring),box-shadow 0.3s;box-shadow:0 6px 24px rgba(19,122,19,0.4);margin-top:1.5rem;}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(19,122,19,0.55);}
    .btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
    #toast-container{position:fixed;top:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.6rem;}
    .tau-toast{display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1.2rem;border-radius:var(--radius-sm);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:260px;font-size:0.88rem;animation:toastIn 0.4s var(--spring);}
    @keyframes toastIn{from{opacity:0;transform:translateX(100%);}to{opacity:1;transform:none;}}
    .tau-toast.error{background:rgba(255,80,104,0.12);border-color:rgba(255,80,104,0.25);color:var(--error);}
  </style>
</head>
<body>
  <div class="bg-canvas"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div id="toast-container"></div>
  <nav>
    <a href="/" class="nav-logo"><img src="/static/img/btc_logo.png" alt="BTC"><span>Beyond The Classroom</span></a>
    <a href="/group-study" class="nav-back"><i class="fa-solid fa-arrow-left" style="margin-right:0.3rem;"></i>Back</a>
  </nav>
  <main>
    <!-- Create form -->
    <div class="card" id="create-card">
      <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-door-open"></i></div>
        <h1>Create a Room</h1>
        <p>A 6-digit code will be generated for your room</p>
      </div>
      <div class="form-group">
        <label>Group Name <span class="optional-label">optional</span></label>
        <div class="input-wrap">
          <i class="fa-solid fa-users input-icon"></i>
          <input type="text" id="group-name" placeholder="e.g. BTC Study Squad, Physics 300L…" maxlength="40"/>
        </div>
      </div>
      <div class="form-group">
        <label>Room Password <span class="optional-label">optional</span></label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="room-password" placeholder="Set a password to restrict access"/>
          <button type="button" class="toggle-pw" onclick="togglePw()"><i class="fa-regular fa-eye" id="pw-eye"></i></button>
        </div>
      </div>
      <button class="btn" id="create-btn" onclick="createRoom()">
        <i class="fa-solid fa-plus"></i> Create Room
      </button>
    </div>

    <!-- Success panel (hidden until room is created) -->
    <div class="card" id="success-card" style="display:none;">
      <div class="card-header">
        <div class="card-icon" style="background:linear-gradient(135deg,#137a13,#3effa0);"><i class="fa-solid fa-check"></i></div>
        <h1>Room Created!</h1>
        <p>Share this link or code with your study group</p>
      </div>
      <div style="margin-bottom:1.2rem;">
        <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.45rem;">Room Code</label>
        <div style="display:flex;align-items:center;gap:0.6rem;">
          <div id="room-code-display" style="font-family:var(--font-display);font-size:2.2rem;font-weight:800;letter-spacing:0.15em;color:var(--accent-light);flex:1;text-align:center;background:rgba(19,122,19,0.08);border:1px solid rgba(19,122,19,0.2);border-radius:12px;padding:0.6rem 1rem;"></div>
          <button onclick="copyCode()" style="background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-muted);padding:0.6rem 0.9rem;cursor:pointer;font-size:0.9rem;transition:0.2s;" title="Copy code"><i class="fa-regular fa-copy"></i></button>
        </div>
      </div>
      <div style="margin-bottom:1.5rem;">
        <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.45rem;">Shareable Link</label>
        <div style="display:flex;align-items:center;gap:0.6rem;">
          <input type="text" id="room-link-input" readonly style="flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:10px;padding:0.7rem 1rem;color:var(--text-muted);font-size:0.82rem;outline:none;"/>
          <button onclick="copyLink()" style="background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);border-radius:10px;color:var(--text-muted);padding:0.6rem 0.9rem;cursor:pointer;font-size:0.9rem;transition:0.2s;" title="Copy link"><i class="fa-solid fa-link"></i></button>
        </div>
      </div>
      <button class="btn" onclick="enterRoom()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Enter Room
      </button>
      <a href="/group-study" style="display:block;text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-muted);text-decoration:none;">← Back to Group Study</a>
    </div>
  </main>
  <script>
    let createdRoomCode = '';

    function togglePw(){
      const inp=document.getElementById('room-password');
      const eye=document.getElementById('pw-eye');
      if(inp.type==='password'){inp.type='text';eye.className='fa-regular fa-eye-slash';}
      else{inp.type='password';eye.className='fa-regular fa-eye';}
    }
    async function createRoom(){
      const password=document.getElementById('room-password').value;
      const btn=document.getElementById('create-btn');
      btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-circle-notch fa-spin"></i> Creating…';
      try{
        const group_name=document.getElementById('group-name').value.trim();
        const res=await fetch('/group-study/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,group_name})});
        const data=await res.json();
        if(data.success){
          createdRoomCode = data.code;
          const link = window.location.origin + '/group-study/room/' + data.code;
          document.getElementById('create-card').style.display='none';
          document.getElementById('success-card').style.display='';
          document.getElementById('room-code-display').textContent = data.code;
          document.getElementById('room-link-input').value = link;
        } else {
          showToast(data.message||'Failed to create room');
          btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-plus"></i> Create Room';
        }
      }catch(e){showToast('Server error. Please try again.');btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-plus"></i> Create Room';}
    }
    function enterRoom(){
      if(createdRoomCode) window.location.href='/group-study/room/'+createdRoomCode;
    }
    function copyCode(){
      navigator.clipboard.writeText(createdRoomCode).then(()=>showToast('Room code copied!','success'));
    }
    function copyLink(){
      const link=document.getElementById('room-link-input').value;
      navigator.clipboard.writeText(link).then(()=>showToast('Link copied!','success'));
    }
    function showToast(msg,type='error'){
      const t=document.createElement('div');
      t.className='tau-toast '+(type==='success'?'':'error');
      t.style.cssText=type==='success'?'background:rgba(62,255,160,0.12);border-color:rgba(62,255,160,0.3);color:#3effa0;':'';
      t.innerHTML=(type==='success'?'<i class="fa-solid fa-circle-check"></i> ':'<i class="fa-solid fa-circle-xmark"></i> ')+msg;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(()=>t.remove(),4000);
    }
  </script>
</body>
</html>
