<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Beyond The Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #05060f; color: #f0f0f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #137a1388, transparent 70%); top: -200px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #1565c066, transparent 70%); bottom: -150px; right: -100px; }
    .card { position: relative; z-index: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 20px; padding: 2.8rem 2.5rem; max-width: 420px; width: 100%; backdrop-filter: blur(24px); box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .card-header { text-align: center; margin-bottom: 2rem; }
    .admin-icon { width: 62px; height: 62px; background: linear-gradient(135deg, #1565c0, #42a5f5); border-radius: 16px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 6px 20px rgba(21,101,192,0.4); }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 0.3rem; }
    .subtitle { color: #8888aa; font-size: 0.88rem; }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; background: rgba(21,101,192,0.15); color: #64b5f6; border: 1px solid rgba(21,101,192,0.3); padding: 3px 10px; border-radius: 20px; margin-top: 0.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.8rem; font-weight: 500; color: #8888aa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    input[type="email"], input[type="password"] { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 0.85rem 1rem; color: #f0f0f8; font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,0.2); }
    input::placeholder { color: #4a4a6a; }
    .btn { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #1565c0, #42a5f5); border: none; border-radius: 10px; color: white; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(21,101,192,0.4); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(21,101,192,0.5); }
    .error-box { background: rgba(255,80,104,0.12); border: 1px solid rgba(255,80,104,0.3); border-radius: 10px; padding: 0.8rem 1rem; color: #ff8095; font-size: 0.88rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #8888aa; font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: #f0f0f8; }
  </style>
</head>
<body>
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="admin-icon">🛡️</div>
      <h1>Admin Access</h1>
      <p class="subtitle">Beyond The Classroom</p>
      <span class="badge">🔒 Restricted Area</span>
    </div>
    {% if error %}
    <div class="error-box">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn">Sign In to Dashboard</button>
    </form>
    <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
  </div>
</body>
</html>
