<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Study — Beyond The Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #05060f; --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.10);
      --accent: #137a13; --accent-light: #1aaa1a; --accent-glow: rgba(19,122,19,0.35);
      --text: #f0f0f8; --text-muted: #8888aa; --radius: 20px;
      --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
      --transition-spring: 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
    .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.4; animation: drift 14s ease-in-out infinite alternate; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #1565c088, transparent 70%); top: -150px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #137a1366, transparent 70%); bottom: -100px; right: -80px; animation-duration: 10s; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px,50px); } }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 2.5rem; background: rgba(5,6,15,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; }
    .nav-logo img { width: 32px; height: 32px; border-radius: 8px; }
    .nav-back { font-size: 0.85rem; color: var(--text-muted); text-decoration: none; padding: 0.45rem 1rem; border-radius: 50px; border: 1px solid var(--glass-border); transition: 0.2s; }
    .nav-back:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    main { position: relative; z-index: 1; width: 100%; max-width: 700px; padding: 7rem 1.5rem 3rem; }
    .page-header { text-align: center; margin-bottom: 3rem; }
    .page-icon { width: 72px; height: 72px; margin: 0 auto 1.2rem; background: linear-gradient(135deg, #1565c0, #1976d2); border-radius: 20px; display: grid; place-items: center; font-size: 1.8rem; box-shadow: 0 8px 32px rgba(21,101,192,0.4); animation: popIn 0.6s var(--transition-spring); }
    @keyframes popIn { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
    .page-header h1 { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, var(--text) 40%, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
    .page-header p { color: var(--text-muted); font-size: 1rem; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 550px) { .options-grid { grid-template-columns: 1fr; } }
    .option-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; text-decoration: none; display: block; transition: transform 0.3s var(--transition-spring), box-shadow 0.3s, border-color 0.3s; position: relative; overflow: hidden; }
    .option-card::before { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s; border-radius: var(--radius); }
    .option-card:hover { transform: translateY(-6px); }
    .option-card.create::before { background: radial-gradient(circle at 50% 0%, rgba(19,122,19,0.15), transparent 70%); }
    .option-card.create:hover { border-color: rgba(19,122,19,0.4); box-shadow: 0 16px 48px rgba(19,122,19,0.2); }
    .option-card.create::before { opacity: 1; }
    .option-card.join::before { background: radial-gradient(circle at 50% 0%, rgba(21,101,192,0.15), transparent 70%); }
    .option-card.join:hover { border-color: rgba(21,101,192,0.4); box-shadow: 0 16px 48px rgba(21,101,192,0.2); }
    .option-card.join::before { opacity: 1; }
    .card-icon { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 16px; display: grid; place-items: center; font-size: 1.6rem; }
    .create .card-icon { background: linear-gradient(135deg, var(--accent), var(--accent-light)); box-shadow: 0 8px 24px var(--accent-glow); }
    .join .card-icon { background: linear-gradient(135deg, #1565c0, #1976d2); box-shadow: 0 8px 24px rgba(21,101,192,0.4); }
    .card-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: 0.6rem; }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
    .card-arrow { display: inline-block; margin-top: 1.2rem; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1.2rem; border-radius: 50px; }
    .create .card-arrow { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; }
    .join .card-arrow { background: linear-gradient(135deg, #1565c0, #1976d2); color: white; }
  </style>
</head>
<body>
  <div class="bg-canvas"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <nav>
    <a href="/" class="nav-logo">
      <img src="/static/img/btc_logo.png" alt="BTC">
      <span>Beyond The Classroom</span>
    </a>
    <a href="/" class="nav-back"><i class="fa-solid fa-arrow-left" style="margin-right:0.3rem;"></i>Home</a>
  </nav>
  <main>
    <div class="page-header">
      <div class="page-icon"><i class="fa-solid fa-users"></i></div>
      <h1>Group Study</h1>
      <p>Collaborate in real-time with classmates in a shared study room</p>
    </div>
    <div class="options-grid">
      <a href="/group-study/new" class="option-card create">
        <div class="card-icon"><i class="fa-solid fa-plus"></i></div>
        <div class="card-title">Create a Room</div>
        <div class="card-desc">Start a new study room and invite classmates with a 6-digit code</div>
        <span class="card-arrow">Create Room →</span>
      </a>
      <a href="/group-study/join-room" class="option-card join">
        <div class="card-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
        <div class="card-title">Join a Room</div>
        <div class="card-desc">Enter a room code shared by your classmate to join their study session</div>
        <span class="card-arrow">Join Room →</span>
      </a>
    </div>
  </main>
</body>
</html>
